# Codemagic CI/CD — alternativa con máquinas macOS propias.
#
# ¿Por qué? Los runners macOS de GitHub Actions están restringidos en esta cuenta
# (ver docs/CI_Y_FIRMA.md). Codemagic aporta sus PROPIAS máquinas macOS, con un
# plan gratuito (~500 min/mes), así que puedes compilar y probar — y publicar a
# TestFlight — sin un Mac y sin depender de los runners de GitHub.
#
# Cómo activarlo (una vez):
#   1. Entra en https://codemagic.io e inicia sesión con GitHub.
#   2. "Add application" → elige el repositorio CarlosDann20/Carlos.
#   3. Codemagic detecta este codemagic.yaml. Lanza el workflow "build-test".
# No se guardan secretos en el repositorio: las claves de firma se configuran en
# la interfaz de Codemagic (Code signing identities / Environment variables).

workflows:

  build-test:
    name: Memora · compilar y probar (Simulador, sin firma)
    instance_type: mac_mini_m2        # plan gratuito
    max_build_duration: 45
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/amazing-pasteur-7bczc8"
        - pattern: "main"
    scripts:
      - name: Instalar XcodeGen
        script: brew install xcodegen
      - name: Generar el proyecto Xcode
        script: xcodegen generate
      - name: Compilar y ejecutar pruebas (Simulador iOS)
        script: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for v in d.values() for x in v if x.get('isAvailable') and ('iPad' in x['name'] or 'iPhone' in x['name'])]
          c.sort(key=lambda x:(0 if 'iPad' in x['name'] else 1))
          print(c[0]['udid'])
          ")
          xcodebuild test \
            -project Memora.xcodeproj \
            -scheme Memora \
            -destination "id=$UDID" \
            -resultBundlePath build/Memora.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcpretty && exit ${PIPESTATUS[0]}
    artifacts:
      - build/Memora.xcresult
      - build.log

  # ---------------------------------------------------------------------------
  # Workflow de TestFlight (requiere Apple Developer Program y configurar la
  # clave de App Store Connect EN CODEMAGIC, no en el repositorio).
  # Pasos: Codemagic → Teams/App settings → Code signing identities → App Store
  # Connect API key (Key ID, Issuer ID, archivo .p8). Luego lanza este workflow.
  # ---------------------------------------------------------------------------
  testflight:
    name: Memora · TestFlight (requiere cuenta Apple de pago)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_asc_key   # nombre que des a la clave en Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.memora.Memora
    scripts:
      - name: Instalar XcodeGen y generar el proyecto
        script: brew install xcodegen && xcodegen generate
      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles
      - name: Construir el .ipa firmado
        script: |
          xcode-project build-ipa \
            --project Memora.xcodeproj \
            --scheme Memora
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
