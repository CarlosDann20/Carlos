name: Preflight (diagnóstico de runners)

# Diagnóstico: ¿qué runners arrancan para esta cuenta? Prueba Linux y varias
# imágenes de macOS. No compila nada.

on:
  workflow_dispatch:
  push:
    branches: ["claude/amazing-pasteur-7bczc8"]
    paths: [".github/workflows/preflight.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linux runner OK"; uname -a

  macos:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-13, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.image }}
    steps:
      - run: |
          echo "macOS runner OK: ${{ matrix.image }}"
          sw_vers
          xcodebuild -version || true
