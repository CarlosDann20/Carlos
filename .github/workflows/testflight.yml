name: Deploy to TestFlight (manual · requiere cuenta Apple)

# Archiva, firma y sube Memora a TestFlight para poder instalarla en el iPad
# SIN un Mac. Usa firma automática con una clave de App Store Connect (.p8),
# así se evita manejar certificados/perfiles .p12 a mano.
#
# REQUISITOS (ver docs/CI_Y_FIRMA.md):
#   - Apple Developer Program (de pago, 99 USD/año).
#   - Secretos en GitHub (Settings → Secrets and variables → Actions):
#       ASC_KEY_ID        ID de la clave de App Store Connect
#       ASC_ISSUER_ID     Issuer ID de App Store Connect
#       ASC_PRIVATE_KEY   contenido del .p8 codificado en base64
#       APPLE_TEAM_ID     Team ID (10 caracteres)
#   Opcional:
#       APP_BUNDLE_ID     (por defecto app.memora.Memora)
#
# NUNCA se guardan secretos en el repositorio; solo se referencian como
# ${{ secrets.* }} y existen cifrados en GitHub.

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Archivar, firmar y subir a TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID || 'app.memora.Memora' }}
    steps:
      - name: Comprobar que existen los secretos
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && missing="$missing ASC_PRIVATE_KEY"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de Apple:$missing. Configúralos en Settings → Secrets and variables → Actions. Guía en docs/CI_Y_FIRMA.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Preparar la clave de App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archivar (firma automática)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Memora.xcodeproj \
            -scheme Memora \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Memora.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tee archive.log

      - name: Exportar IPA para App Store Connect
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Memora.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log

      - name: Subir a TestFlight
        run: |
          IPA=$(find build/ipa -name "*.ipa" | head -1)
          echo "Subiendo $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Subir el IPA como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-ipa
          path: build/ipa/*.ipa
          if-no-files-found: ignore

      - name: Limpiar la clave
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
